# Kit: pin the Codex CLI version (runs INSIDE the sandbox)
#
# The sbx image ships the Codex version it was built with (0.149.1 in the
# 2026-09-23 image). This kit installs one exact version, so every run tests
# the same harness. It also matters for tracing: the MLflow connector parses
# Codex's transcript format, which changes between Codex versions (see
# ../tracing/files/home/.mlflow-codex/setup_tracing.py).
schemaVersion: "2"
kind: mixin
name: codex-cli-pinned
description: Install a pinned Codex version.

args:
  version:
    description: Codex version to install (npm @openai/codex).
    default: "0.162.1"

permissions:
  network:
    allow:
      - registry.npmjs.org

setup:
  install:
    - command: >-
        npm install -g @openai/codex@${{ kit.args.version }} &&
        codex --version | grep -q " ${{ kit.args.version }}$"
      user: "1000"
