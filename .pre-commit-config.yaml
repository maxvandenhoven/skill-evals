# Pre-commit hooks: the same checks as `make check` on the files in a commit. Install
# them with `make install-pre-commit`.
# The hooks run the tool versions from uv.lock through `uv run`, so they match `make`.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --output-format concise
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false  # ty checks the files configured in pyproject.toml
      - id: yamllint
        name: yamllint
        entry: uv run yamllint --strict
        language: system
        types: [yaml]
