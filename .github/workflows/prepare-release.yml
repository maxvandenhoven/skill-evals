# Opens the release pull request: the next version (suggested from the conventional
# commits since the last tag, or the one given), the updated CHANGELOG.md, and a
# generated title and description. Start it from the Actions tab. Only admins and
# maintainers can, and only from main. Merging the pull request starts the Release
# workflow (see MAINTAINING.md).
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. Leave empty to use the suggested one.
        required: false
        type: string

permissions: { }

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Allow only admins and maintainers, running from main
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "Run this workflow from main, not from $REF." >&2
            exit 1
          fi
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" \
            --jq .role_name)
          case "$role" in
            admin | maintain) ;;
            *)
              echo "$ACTOR has the role '$role'; only admins and maintainers can." >&2
              exit 1
              ;;
          esac

  prepare:
    name: open release PR
    needs: authorize
    runs-on: ubuntu-24.04
    # Holds the GitHub App key, available to runs from main only.
    environment: release
    permissions:
      contents: read
    steps:
      # The App's token, not GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN
      # don't start the CI checks that the ruleset requires.
      - id: app
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Stop if a release pull request is already open
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          open=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | length')
          if [ "$open" -gt 0 ]; then
            echo "A release pull request is already open; merge or close it first." >&2
            exit 1
          fi
      - name: Check the version, if one was given
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pattern='^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ $pattern ]]; then
            echo "'$VERSION' is not a version like 1.2.3 or 1.3.0rc1." >&2
            exit 1
          fi
      - name: Bump the version and update the changelog
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
        run: |
          git config user.name "$BOT"
          git config user.email "$BOT@users.noreply.github.com"
          scripts/release-prepare.sh "$VERSION"
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Check the result
        run: scripts/check-release.sh
      - name: Commit, push and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          scripts/release-pr-body.sh "$VERSION" > "$RUNNER_TEMP/body.md"
          if [ "$(git status --porcelain | wc -l)" -ne 3 ]; then
            echo "Expected changes to pyproject.toml, uv.lock and CHANGELOG.md only." >&2
            git status --short >&2
            exit 1
          fi
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit --quiet -m "chore: release v$VERSION"
          git push origin "release/v$VERSION"
          url=$(gh pr create --base main --head "release/v$VERSION" \
            --title "chore: release v$VERSION" --body-file "$RUNNER_TEMP/body.md")
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
