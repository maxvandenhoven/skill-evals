# PRs are squash-merged and the title becomes the commit on main, so the title must be
# a conventional commit (feat:, fix:, docs:, ..., or feat!: for a breaking change).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional title
    runs-on: ubuntu-24.04
    steps:
      # yamllint disable-line rule:line-length
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
