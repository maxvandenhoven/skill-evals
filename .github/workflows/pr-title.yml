# PRs are squash-merged and the title becomes the commit on main, so the title must be
# a conventional commit (feat:, fix:, docs:, ..., or feat!: for a breaking change).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: conventional title
    runs-on: ubuntu-24.04
    steps:
      # yamllint disable-line rule:line-length
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f  # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
